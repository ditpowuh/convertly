name: Convertly Type Check CI

on:
  push:
    branches: ["main"]
    paths: ["*.py"]
  pull_request:
    branches: ["main"]
    paths: ["*.py"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        version: "0.12.13"
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --locked

    - name: Run mypy
      run: uv run mypy --platform win32 src
