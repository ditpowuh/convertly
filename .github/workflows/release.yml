name: Convertly Build CD

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        version: "0.12.13"
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --locked

    - name: Run build command
      run: poetry run flet build windows --yes
      env:
        PYTHONUTF8: 1

    - name: Zip build output
      run: Compress-Archive -Path build/windows/* -DestinationPath "convertly-windows-${{ github.event.release.tag_name }}.zip"

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: convertly-windows-${{ github.event.release.tag_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
