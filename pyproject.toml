[project]
name = "Convertly"
version = "0.1.0"
description = "A Flet application for converting files"
readme = "README.md"
requires-python = ">=3.12, <4.0"
authors = [{name = "Ditpowuh"}]
dependencies = [
    "ffmpeg-binaries-compat (>=1.1.0,<2.0.0)",
    "flet>=0.85.3",
    "fonttools (>=4.64.0,<5.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "pillow-heif (>=1.7.0,<2.0.0)",
    "pymupdf (>=1.28.2,<2.0.0)",
    "python-ffmpeg (>=2.0.12,<3.0.0)"
]

[dependency-groups]
dev = [
    "flet-cli>=0.85.3",
    "flet-desktop>=0.85.3",
    "flet-web>=0.85.3",
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.flet]
product = "Convertly"
company = "Ditpowuh"
copyright = "Copyright (C) Ditpowuh 2025"
org = "com.ditpowuh"
bundle_id = "com.ditpowuh.convertly"

[tool.flet.app]
path = "src"

[tool.flet.app.boot_screen]
show = true
message = "Preparing Convertly..."

[tool.flet.app.startup_screen]
show = true
message = "Starting up Convertly..."

[tool.mypy]
disable_error_code = ["import-untyped"]
